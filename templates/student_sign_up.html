{% extends "base.html" %}

{% block main_block %}

<div class="student" style="padding-right:50px;padding-left: 50px;padding-top: 20px;padding-bottom: 20px; ">
    <div class="row signup-container">
        <div class="col-md-6 signup-left">
            <h2 class="text-center"><strong>Student Sign-Up</strong></h2>
            <form id="studentSignupForm" method="POST">
                <div class="mb-3">
                    <input type="text" name="name" class="form-control" id="name" required placeholder="Name">
                </div>
                <div class="mb-3">
                    <input type="email" name="email" class="form-control" id="email" required placeholder="Email ">
                </div>
                <div class="mb-3">
                    <input type="date" class="form-control" name="dob" id="dob" required placeholder="Date of Birth">
                </div>
                <div class="mb-3">
                    <select name="gender" class="form-select" id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="mb-3">
                    <input type="tel" name="phone" class="form-control" id="phone" required maxlength="10"
                        minlength="10" placeholder="Enter Phone Number">
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" id="password" required
                        placeholder="Enter Password">
                </div>
                <div class="mb-3">
                    <input type="password" name="confirmPassword" class="form-control" id="confirmPassword" required
                        placeholder="Confirm Password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            </form>
            <p class="text-center mt-3">Have an account? <a href="#">Sign In</a></p>
        </div>
        <div class="col-md-5 signup-right d-none d-md-block" style="padding: 10px;">
            <img src="{{url_for('static',filename='/images/studentlogo.jpeg')}}" alt="student logo" width="700px"
                height="500px">
        </div>
    </div>
</div>


{% endblock %}
