{% extends "base.html" %}

{% block main_block %} 
 
<div class="container">
    <div class="signup-container">
        <h2 class="text-center"><strong>Student Sign-Up</strong></h2>
        <form id="signupForm" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" id="name" required placeholder="Enter Full Name">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" id="email" required placeholder="Enter Email Address">
            </div>
            <div class="mb-3">
                <label for="DOB" class="form-label"> Date of Birth </label>
                <input type="date" class="form-control" name="DOB" id="DOB" required>
            </div>
            <div class="mb-3">
                <label for="gender" class="form-label"> Gender </label>
                <select name="gender" class="form-select" id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-control" id="phone" required maxlength="10" minlength="10" placeholder="Enter Phone Number">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" class="form-control" id="password" required placeholder="Enter Password">
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" name="confirmPassword" class="form-control" id="confirmPassword" required placeholder="Confirm Password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        </form>
    </div>
</div>


{% endblock %}
