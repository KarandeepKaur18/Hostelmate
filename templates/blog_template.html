{% extends 'base.html' %}

{% block main_block %}
<div class="blog-container">
    <div class="blog-header">
        <h1>{{ blog.title }}</h1>
    </div>

    <div class="blog-content">
        <img src="{{ url_for('static', filename=blog.image) }}" alt="Blog Image" class="blog-main-image">
        <p>{{ blog.content }}</p>
    </div>
</div>
{% endblock %}
