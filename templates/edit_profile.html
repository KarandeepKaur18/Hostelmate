<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Book Store</title>

    <link rel="stylesheet" href="https://unpkg.com/swiper@7/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
        }

        .profile-container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 15px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .btn-save {
            width: 100%;
            padding: 10px;
            background-color: #2a88f4;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-save:hover {
            background-color: #063668;
        }
    </style>
</head>
<body>
    
<!-- header section starts -->
<header class="header">
    <div class="header-1">
        <a href="#" class="logo"> <i class="fas fa-book"></i> Book Point </a>
        
        <form action="{{ url_for('search') }}" method="get" class="search-form">
            <input type="text" name="q" placeholder="Search for a book..." required>
            <button type="submit"><label for="search-box" class="fas fa-search"></label></button>
        </form>
        
        <div class="icons">
            <div id="search-btn" class="fas fa-search"></div>
            <a href="{{url_for('cart')}}" class="fas fa-shopping-cart"></a>
        </div>
        
    </div>
    <div class="header-2">
        <nav class="navbar">
            <a href="{{ url_for('home') }}">home</a>
            <a href="{{ url_for('aboutus') }}">About Us</a>
            <a href="{{ url_for('contact') }}">Contact Us</a>

            <a href="{{ url_for('dashboard') }}">Dashboard</a>  
            <a href="{{ url_for('profile') }}">Go to Profile</a>
                    
            <a href="{{ url_for('logout') }}">Logout</a>
            
        </nav>
    </div>
</header>
<!-- header section ends -->



<div class="profile-container">
    <h2>Edit Profile</h2>
    <hr>

    <!-- Profile Picture -->
    <img id="profileImagePreview" class="profile-img" src="{{ url_for('static', filename='images/' + (user.profile_picture if user.profile_picture else 'default.png')) }}" alt="Profile Picture">

    <!-- Profile Form -->
    <form action="{{ url_for('edit_profile') }}" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ current_user.name }}" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ current_user.email }}" required>
        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="text" id="mobile" name="mobile" class="form-control" value="{{ current_user.mobile }}" required>
        </div>

        <div class="form-group">
            <label for="profile_picture">Profile Picture</label>
            <input type="file" id="profile_picture" name="profile_picture" class="form-control" accept="image/*" onchange="previewImage(event)">
        </div>

        <button type="submit" class="btn-save">Save Changes</button>
    </form>
</div>


<!-- footer section starts -->
<section class="footer">
    <div class="box-container">
        <div class="box">
            <h3>our locations</h3>
            <a href="#"> <i class="fas fa-map-marker-alt"></i> India </a>
            <a href="#"> <i class="fas fa-map-marker-alt"></i> USA </a>
            <a href="#"> <i class="fas fa-map-marker-alt"></i> Russia </a>
            <a href="#"> <i class="fas fa-map-marker-alt"></i> France </a>
            <a href="#"> <i class="fas fa-map-marker-alt"></i> Japan </a>
        </div>

        <div class="box">
            <h3>quick links</h3>
            <a href="#"> <i class="fas fa-arrow-right"></i> Home </a>
            <a href="#"> <i class="fas fa-arrow-right"></i> Featured </a>
            <a href="#"> <i class="fas fa-arrow-right"></i> Arrivals </a>
            <a href="#"> <i class="fas fa-arrow-right"></i> Reviews </a>
            <a href="#"> <i class="fas fa-arrow-right"></i> Blogs </a>
        </div>

        <div class="box">
            <h3>contact info</h3>
            <a href="#"> <i class="fas fa-phone"></i> +91 8853455765 </a>
            <a href="#"> <i class="fas fa-phone"></i> +91 9140026484 </a>
            <a href="#"> <i class="fas fa-envelope"></i> onlinebookstore@gmail.com </a>
        </div>
    </div>

    <div class="share">
        <a href="#" class="fab fa-facebook-f"></a>
        <a href="#" class="fab fa-twitter"></a>
        <a href="#" class="fab fa-instagram"></a>
        <a href="#" class="fab fa-linkedin"></a>
        <a href="#" class="fab fa-pinterest"></a>
    </div>

    
    <div class="credit"><span>&copy; 2025 Bookstore</span> | all rights reserved! </div>
</section>
<!-- footer section ends -->

<script src="/static/js/script.js"></script>

<script>
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById('profileImagePreview');
            output.src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>
</body>
</html>
