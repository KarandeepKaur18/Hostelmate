{% extends 'base.html' %}

{% block styles %}
<link rel="stylesheet" href="{{url_for('static', filename='CSS/authentication.css')}}">
{% endblock %}

{% block main_block %}
<div class="signupUpper text-center mt-5">
    <div class="signupHead">
    <h2 class="mb-4" style="color: rgb(250, 224, 224); font-size: 40px;"><strong>Sign Up As</strong></h2>
</div>
    <div class="row signupcard" style="padding: 120px;">
        <div class="col-md-4 mb-4">
                    <a href="{{url_for('student_sign_up')}}" class="btn card" style="display:inline-block;padding: 20px; font-size: 40px;color:white;background-color: rgb(45, 103, 105);" ><strong>Student</strong></a>
        </div>
        <div class=" col-md-4 mb-4 " >
            <a href="{{url_for('staff_sign_up')}}" class="btn card" style="display:inline-block; padding: 20px; font-size: 40px; background-color: rgb(104, 22, 76);color: white;" ><strong>Staff</strong></a>
        </div>
        <div class="col-md-4 mb-4">
            <a href="{{url_for('admin_sign_up')}}" class="btn card" style="display:inline-block; padding: 20px; font-size: 40px; background-color: rgb(127, 80, 39); color: white;" ><strong>Admin</strong></a>
        </div>
    </div>
</div>
{% endblock %}
