<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelMate</title>

  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js" crossorigin="anonymous"></script>
  
  
<link rel="stylesheet" href="static\CSS\style.css">
</head>
<body>


    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
 
            <a class="logo" href="#">
                <img src="static/hostelmate-removebg-preview.png" alt="HostelMate Logo">
            </a>

         
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

           
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-houses"></i> List Your Property</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-telephone"></i> +91 978928393</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-envelope"></i> info@hostelmate.com</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn-signin" href="#">Sign In</a>
                    </li>
                </ul>

                
                <form class="d-flex ms-3">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-info" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="bg-light">
        {% block main_block %}
        {% endblock %}
    </main>

    <footer class="text-center text-lg-start">
      <div class="container">
          <div class="row">
              
              <div class="col-md-4">
                  <h5>Company</h5>
                  <ul class="list-unstyled">
                      <li><a href="#">About Us</a></li>
                      <li><a href="#">Careers</a></li>
                      <li><a href="#">Press</a></li>
                      <li><a href="#">Help</a></li>
                  </ul>
              </div>
  
              <div class="col-md-4">
                  <h5>Explore</h5>
                  <ul class="list-unstyled">
                      <li><a href="#">Top Destinations</a></li>
                      <li><a href="#">Find a Hostel</a></li>
                      <li><a href="#">Deals</a></li>
                      <li><a href="#">Blog</a></li>
                  </ul>
              </div>
  
             
              <div class="col-md-4 text-md-end">
                  <h5>Follow Us</h5>
                  <div class="social-icons">
                      <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                      <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                      <a href="https://twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
                      <a href="https://youtube.com" target="_blank"><i class="fab fa-youtube"></i></a>
                  </div>
              </div>
          </div>
  
          <hr class="my-4">
  
          
          <div class="row">
              <div class="col-md-6">
                  <p>&copy; 2025 HostelMate. All Rights Reserved.</p>
              </div>


              </div>
          </div>
      </div>
  </footer>
    

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
