{% extends 'base.html' %}

{% block styles %}
<link rel="stylesheet" href="{{url_for('static',filename='CSS/authentication.css')}}">
{% endblock %}

{% block main_block %}

<div class="loginUpper" style="display: flex; justify-content: center;align-items: center; height: 80vh;">
<div class="login-box container" style=" display: flex; justify-content: center; align-items: center; height: 45vh; border-radius: 4px;
        border: 1px solid #979696; width: 30vw;">
    <div>
    <h2 class="text-center" style="color: white;" ><strong>Login</strong></h2>
    <form id="loginForm" action="/login" method="POST">
        <div class="mb-3">
        <input type="email" class="form-control" id="email" name="email" required placeholder="Email">
    </div>
    <div class="mb-3">
        <input type="password" class="form-control" id="password" name="password" required placeholder="Password">
        </div>
    <div class="text-center">    
        <button class="btn btn-primary" type="submit">Login</button>
    </div>
    <br>
    </form>
    <p style="color: aliceblue;"><strong>Don't have an account? </strong><a href="{{url_for('signup')}}"><strong>Sign Up</strong></a></p>
    <a href="{{url_for('forgot_password')}}" style="color: aliceblue;"><strong> Forgot Password </strong></a>
</div>
</div>
</div>

{% endblock %}
